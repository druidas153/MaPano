plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists())
{
    localPropertiesFile.withInputStream
            {
                stream -> localProperties.load(stream)
            }
}

android {
    namespace 'com.myaplicacion.mapano'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.myaplicacion.mapano"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def backendUrl = localProperties.getProperty(
                "BACKEND_URL",
                "http://10.0.2.2:8080/"
        )
        buildConfigField "String", "BACKEND_URL", "\"${backendUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // ============ AndroidX Core ============
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.cardview

    // ============ Lifecycle (ViewModel + LiveData) ============
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    // ============ Room (Base de datos local) ============
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // ============ Retrofit (Comunicaciones HTTP) ============
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

    // ============ Gson (Parseo JSON) ============
    implementation libs.gson

    // ============ Glide (Imágenes) ============
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // ============ osmdroid (Mapa OpenStreetMap) ============
    implementation libs.osmdroid

    // ============ CameraX (Captura multimedia) ============
    implementation libs.camerax.core
    implementation libs.camerax.camera2
    implementation libs.camerax.lifecycle
    implementation libs.camerax.view

    // ============ Play Services Location (GPS) ============
    implementation libs.play.services.location

    // ============ Testing ============
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}